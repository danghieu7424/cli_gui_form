[package]
name = "cli_gui_form"
version = "0.1.0"
edition = "2024"
authors = ["Dang Hieu <danghieu7424@gmail.com>"]
description = "A minimal, professional, zero-noise TUI Form & Design System library for Rust powered by Ratatui."
repository = "https://github.com/danghieu7424/cli_gui_form"
homepage = "https://github.com/danghieu7424/cli_gui_form"
documentation = "https://docs.rs/cli_gui_form"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "cli", "form", "terminal"]
categories = ["command-line-interface", "gui"]

[dependencies]
crossterm = "0.28"
ratatui = "0.28"

[dev-dependencies]
crossterm = "0.28"
ratatui = "0.28"